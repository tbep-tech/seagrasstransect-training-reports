<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seagrass Transect Training Report Cards</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      color: #2d3748;
      min-height: 100vh;
    }

    header {
      background: #004F7E;
      color: white;
      padding: 2rem 2rem 1.75rem;
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .header-logo { flex-shrink: 0; height: 48px; width: auto; }
    .header-text { flex: 1; }
    header h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: -0.3px; }
    header p { margin-top: 0.3rem; font-size: 0.92rem; opacity: 0.8; }

    .dashboard-btn {
      display: inline-block;
      margin-top: 1rem;
      background: rgba(255,255,255,0.12);
      color: white;
      border: 1.5px solid rgba(255,255,255,0.45);
      padding: 0.4rem 1rem;
      border-radius: 5px;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: background 0.15s;
    }
    .dashboard-btn:hover { background: rgba(255,255,255,0.22); }

    main {
      max-width: 960px;
      margin: 2.5rem auto;
      padding: 0 1.5rem 3rem;
    }

    .year-section { margin-bottom: 2.5rem; }

    .year-heading {
      font-size: 1.2rem;
      font-weight: 700;
      color: #004F7E;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid #004F7E;
      margin-bottom: 1rem;
    }

    .group-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 0.65rem;
    }

    .group-card {
      background: white;
      border: 1px solid #dde3ea;
      border-radius: 7px;
      padding: 0.8rem 1rem;
      transition: box-shadow 0.15s, border-color 0.15s;
    }
    .group-card:hover {
      box-shadow: 0 3px 12px rgba(0,79,126,0.12);
      border-color: #004F7E;
    }
    .group-card a {
      text-decoration: none;
      color: #004F7E;
      font-size: 0.88rem;
      font-weight: 500;
      display: block;
    }
    .group-card a:hover { color: #003260; }

    footer {
      text-align: center;
      color: #999;
      font-size: 0.82rem;
      padding: 2rem;
      border-top: 1px solid #e2e8f0;
    }
    footer a { color: #004F7E; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <img class="header-logo" src="__LOGO_SRC__" alt="TBEP logo">
      <div class="header-text">
        <h1>Seagrass Transect Training Report Cards</h1>
        <p>Annual calibration results for seagrass monitoring groups in Tampa Bay</p>
        <a class="dashboard-btn"
           href="https://tbep-tech.github.io/seagrasstransect-training-reports/app"
           target="_blank">Multi-Year Dashboard &#8594;</a>
      </div>
    </div>
  </header>
  <main>
<!-- REPORT_CONTENT -->
  </main>
  <footer>
    <a href="https://tbep.org" target="_blank">Tampa Bay Estuary Program</a>
  </footer>
</body>
</html>
